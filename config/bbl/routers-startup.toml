		"Essentia Per Operation 5" = 64
		#The most Rift energy per operation that tier 1 can move (needs BBL Rifts).
		# Default: 800
		# Range: > 1
		"Rift Energy Per Operation 1" = 800
		#The most Rift energy per operation that tier 2 can move (needs BBL Rifts).
		# Default: 32000
		# Range: > 1
		"Rift Energy Per Operation 2" = 32000
		#The most Rift energy per operation that tier 3 can move (needs BBL Rifts).
		# Default: 64000
		# Range: > 1
		"Rift Energy Per Operation 3" = 64000
		#The most Rift energy per operation that tier 4 can move (needs BBL Rifts).
		# Default: 128000
