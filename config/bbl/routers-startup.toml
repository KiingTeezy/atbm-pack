		#The most essentia per operation that tier 2 can move (needs Thaumaturge).
		# Default: 8
		# Range: > 1
		"Essentia Per Operation 2" = 8
		#The most essentia per operation that tier 3 can move (needs Thaumaturge).
		# Default: 16
		# Range: > 1
