#Distributor
[Distributor]
	#The range of the distributor in blocks.
	# Default: 10
	# Range: 1 ~ 64
	"Distributor Range" = 10
	#The most machines a single distributor will share resources between. If more are in range, the closest ones are used.
	# Default: 64
	# Range: 1 ~ 1024
	"Distributor Max Machines" = 64
	#How often, in ticks, a distributor looks again for the machines around it. A new machine can take up to this long to start receiving.
	# Default: 100
	# Range: 1 ~ 1200
	"Distributor Refresh Ticks" = 100

	#Routers Config
	[Distributor."RF Upgrades"]
		#The maximum RF per tick that tier 1 can provide.
		# Default: 800
		# Range: > 1
		"RF Per Operation 1" = 800
		#The maximum RF per tick that tier 2 can provide.
		# Default: 32000
		# Range: > 1
		"RF Per Operation 2" = 32000
		#The maximum RF per tick that tier 3 can provide.
		# Default: 64000
		# Range: > 1
		"RF Per Operation 3" = 64000
		#The maximum RF per tick that tier 4 can provide.
		# Default: 128000
		# Range: > 1
		"RF Per Operation 4" = 128000
		#The maximum RF per tick that tier 5 can provide.
		# Default: 250000000
		# Range: > 1
		"RF Per Operation 5" = 250000000
		#The most essentia per operation that tier 1 can move (needs Thaumaturge). A jar holds 250.
		# Default: 4
